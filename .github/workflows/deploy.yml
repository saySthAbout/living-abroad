name: Deploy to GCP

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: SSH into GCP VM and redeploy
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.GCP_HOST }}
          username: ${{ secrets.GCP_USER }}
          key: ${{ secrets.GCP_SSH_PRIVATE_KEY }}
          command_timeout: 20m
          script: |
            set -e
            git config --global --add safe.directory /home/saysthabout/living-abroad
            cd /home/saysthabout/living-abroad
            git fetch origin
            git checkout main
            git reset --hard origin/main
            docker compose up -d --build
            docker compose restart nginx
            docker image prune -f
