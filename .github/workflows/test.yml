name: Run Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.2-pg18
        env:
          POSTGRES_USER: living_abroad
          POSTGRES_PASSWORD: living_abroad_test
          POSTGRES_DB: living_abroad
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U living_abroad -d living_abroad"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_NAME: living_abroad
      DB_USER: living_abroad
      DB_PASSWORD: living_abroad_test
      JWT_SECRET: ci-test-only-secret-do-not-use-in-prod-env
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Run Gradle tests with JaCoCo coverage
        working-directory: backend
        run: ./gradlew test jacocoTestReport

      - name: Upload backend test & coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-report
          path: |
            backend/build/reports/tests/test
            backend/build/reports/jacoco

  ai-server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies (CPU-only torch)
        working-directory: ai-server
        run: |
          pip install torch==2.13.0 --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
          pip install pytest-cov

      - name: Run pytest with coverage
        working-directory: ai-server
        run: pytest --cov=app --cov-report=xml --cov-report=html --cov-report=term

      - name: Upload ai-server test & coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-server-coverage-report
          path: |
            ai-server/coverage.xml
            ai-server/htmlcov

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Run Vitest with coverage
        working-directory: frontend
        run: npm run test:coverage

      - name: Upload frontend coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage-report
          path: frontend/coverage
