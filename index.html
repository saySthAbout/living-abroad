<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>Living Abroad — 프로젝트 보고서</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root{
    --navy:#1b2a52; --navy-2:#2a3f73; --gold:#c9a227;
    --paper:#eef1f6; --panel:#ffffff; --ink:#12192b; --ink-soft:#4b5568; --line:#d7dce6;
  }
  @media (prefers-color-scheme: dark){
    :root{ --paper:#0a1526; --panel:#101f38; --ink:#e8ecf4; --ink-soft:#aab4c8; --line:#243252; --gold:#e0b83c; }
  }
  *{ box-sizing:border-box; }
  body{
    margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
    background:var(--paper); color:var(--ink);
    font-family:-apple-system,"Segoe UI","Malgun Gothic","Apple SD Gothic Neo",sans-serif;
    padding:2rem;
  }
  .card{
    background:var(--panel); border:1px solid var(--line); border-radius:14px;
    padding:2.5rem 2.8rem; max-width:34rem; width:100%; text-align:center;
    box-shadow:0 8px 30px rgba(20,30,50,.08);
  }
  .kicker{ font-size:.78rem; letter-spacing:.14em; text-transform:uppercase; color:var(--gold); font-weight:700; margin-bottom:.5rem; }
  h1{ font-size:1.7rem; margin:0 0 .6rem; letter-spacing:-.01em; }
  p{ color:var(--ink-soft); line-height:1.6; margin:0 0 1.6rem; font-size:.95rem; }
  a.btn{
    display:inline-block; background:var(--navy); color:#fff; text-decoration:none;
    padding:.8rem 1.8rem; border-radius:8px; font-weight:600; font-size:.95rem;
  }
  a.btn:hover{ background:var(--navy-2); }
  .meta{ margin-top:1.5rem; font-size:.8rem; color:var(--ink-soft); }
</style>
</head>
<body>
  <div class="card">
    <div class="kicker">Portfolio</div>
    <h1>Living Abroad — 프로젝트 보고서</h1>
    <p>AI 기반 해외 취업·이주 가이드 플랫폼 — 시스템 개요, 기획, 설계, 트러블슈팅을 정리한 보고서입니다.</p>
    <a class="btn" href="./living-abroad-report.pdf" target="_blank" rel="noopener">PDF 보기</a>
    <div class="meta">곽진아 · 2026.07.30</div>
  </div>
</body>
</html>
